name: Check grammar updates

# Weekly check for new upstream versions of any grammar in grammary.toml.
# Compares live upstream revisions against the committed baseline
# (grammar_versions.json) and, if any have moved, opens or refreshes a
# tracking issue.  Also runnable on demand.

on:
  schedule:
    # 07:00 UTC every Monday
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get install -y subversion

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check for grammar updates
        id: check
        run: |
          set +e
          uv run --python 3.12 python scripts/check_grammar_updates.py --output report.md
          rc=$?
          set -e
          # Exit 1 means drift, but an uncaught exception also exits 1, so
          # only trust it when the report was actually written.
          if [ "$rc" -ne 0 ] && { [ "$rc" -ne 1 ] || [ ! -f report.md ]; }; then
            echo "::error::check_grammar_updates.py failed (exit $rc)"
            exit "$rc"
          fi
          echo "drift=$rc" >> "$GITHUB_OUTPUT"

      - name: Open or refresh tracking issue
        if: steps.check.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Grammar source updates available"
          body="$(cat report.md)

          _Generated by the weekly \`check-updates\` workflow. Rebuild the
          affected grammars, then run
          \`uv run python scripts/check_grammar_updates.py --update\` and commit
          \`grammar_versions.json\` to acknowledge._"
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            echo "Updated issue #$existing"
          else
            gh issue create --title "$title" --body "$body" --label grammar-update \
              || gh issue create --title "$title" --body "$body"
          fi
