# grew-match reverse proxy: frontend (static files, port 8000) and
# backend (dream/OCaml API, port 8899), both started by grew-match.service.
#
# Install:
#   sudo cp grew-match-apache.conf /etc/apache2/conf-available/grew-match.conf
#   sudo a2enconf grew-match
#   sudo systemctl reload apache2
#
# Requires mod_proxy + mod_proxy_http (already enabled for ltdb-apache.conf)
# and mod_alias (for RedirectMatch; enabled by default).

# canonicalize /grew-match -> /grew-match/: the frontend's HTML uses
# relative asset paths (css/, js/, ...), which only resolve correctly
# when the browser's address bar has the trailing slash
RedirectMatch permanent "^/grew-match$" "/grew-match/"

ProxyPass        "/grew-match/" "http://localhost:8000/"
ProxyPassReverse "/grew-match/" "http://localhost:8000/"

ProxyPass        "/grew-match-api/" "http://localhost:8899/"
ProxyPassReverse "/grew-match-api/" "http://localhost:8899/"
